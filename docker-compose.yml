version: "3.9"

services:
  # ─── MongoDB ───
  mongo:
    image: mongo:7
    container_name: codecampus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: codecampus
    networks:
      - codecampus-net

  # ─── Backend API (Express + Mongoose) ───
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: codecampus-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://mongo:27017/codecampus
      SERVER_PORT: 5001
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - codecampus-net

  # ─── Frontend (development mode) ───
  # Use this for local dev with hot-reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: codecampus-frontend-dev
    ports:
      - "4028:4028"
    environment:
      VITE_API_URL: http://localhost:5001/api
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - codecampus-net
    profiles:
      - dev

  # ─── Frontend (production mode with nginx) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: codecampus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - codecampus-net
    profiles:
      - prod

volumes:
  mongo-data:
    driver: local

networks:
  codecampus-net:
    driver: bridge
