<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="IDE walkthrough animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1f" />
      <stop offset="100%" stop-color="#182a57" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121b36" />
      <stop offset="100%" stop-color="#1b376f" />
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)" />

  <rect x="60" y="40" width="1080" height="440" rx="22" fill="#0f172d" stroke="#5ce1ff" stroke-opacity="0.25" />
  <rect x="60" y="40" width="1080" height="40" rx="22" fill="#141f3a" />

  <circle cx="90" cy="60" r="6" fill="#ff6b6b" />
  <circle cx="110" cy="60" r="6" fill="#ffd166" />
  <circle cx="130" cy="60" r="6" fill="#06d6a0" />

  <rect x="90" y="95" width="190" height="360" rx="14" fill="url(#panel)" />
  <rect x="305" y="95" width="560" height="250" rx="14" fill="#0b1224" stroke="#2b4b8f" stroke-opacity="0.7" />
  <rect x="305" y="365" width="560" height="90" rx="14" fill="#0f1731" />
  <rect x="885" y="95" width="215" height="360" rx="14" fill="url(#panel)" />

  <g font-family="Segoe UI, Arial, sans-serif" fill="#c9d6ff" font-size="12">
    <text x="110" y="135" font-weight="600">Explorer</text>
    <text x="110" y="160">assignments</text>
    <text x="110" y="180">tests</text>
    <text x="110" y="200">submission</text>

    <text x="330" y="130" fill="#7aa5ff">/assignment-workspace</text>
    <text x="330" y="160">function solve(input) {</text>
    <text x="330" y="180">  const data = parse(input);</text>
    <text x="330" y="200">  return runTests(data);</text>
    <text x="330" y="220">}</text>

    <text x="330" y="395" fill="#9bb4ff">$ run</text>
    <text x="330" y="420" fill="#9bb4ff">Tests: 18 passed</text>

    <text x="905" y="130" font-weight="600">AI Coach</text>
    <text x="905" y="155" font-size="11">Hint: check edge cases</text>
    <text x="905" y="172" font-size="11">when input is empty.</text>
  </g>

  <rect x="305" y="95" width="560" height="250" rx="14" fill="none" stroke="#5ce1ff" stroke-width="2" opacity="0.0">
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5" />
  </rect>

  <rect x="90" y="95" width="190" height="360" rx="14" fill="none" stroke="#8a7bff" stroke-width="2" opacity="0.0">
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5" begin="2s" />
  </rect>

  <rect x="305" y="365" width="560" height="90" rx="14" fill="none" stroke="#5ce1ff" stroke-width="2" opacity="0.0">
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5" begin="4s" />
  </rect>

  <rect x="885" y="95" width="215" height="360" rx="14" fill="none" stroke="#8a7bff" stroke-width="2" opacity="0.0">
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5" begin="6s" />
  </rect>

  <rect x="322" y="152" width="10" height="14" fill="#5ce1ff" opacity="0.8">
    <animate attributeName="y" values="152;212;172;152" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
