      <stop offset="0%" stop-color="#0c1122" />
      <stop offset="100%" stop-color="#1a2f63" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" />

  <g font-family="Segoe UI, Arial, sans-serif" fill="#e8f0ff" text-anchor="middle">
